<title>Cờ Tỷ Phú Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: bàn cờ đẳng cự cố định giữa màn hình, HUD nổi ở 4 góc và cột trái */
:root{
  --sky-1:#2e94d8; --sky-2:#78c8ef; --sky-3:#cdeeff;
  --grass:#78c553; --grass-2:#68b445; --kerb:#e4d9b8;
  --slab-top:#5c84ad; --slab-side:#43688e; --slab-deep:#2f4c6c; --rock:#27425e;
  --tile-face:#fcfdff;
  --panel:rgba(255,255,255,.95); --panel-ink:#13203a; --panel-sub:#5a6a84;
  --panel-line:#dde5f1; --panel-shadow:rgba(18,40,78,.2);
  --accent:#e02f52; --accent-ink:#ffffff; --gold:#f5b821;
  --rail:rgba(255,255,255,.92);
  --glare:.22; --vig:.26;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-1:#0b1830; --sky-2:#162d52; --sky-3:#27496f;
    --grass:#2e6b46; --grass-2:#275b3b; --kerb:#3b4c66;
    --slab-top:#2c3b54; --slab-side:#1e2a3c; --slab-deep:#151d2b; --rock:#121a27;
    --tile-face:#e9eef6;
    --panel:rgba(17,27,45,.93); --panel-ink:#e9f1fb; --panel-sub:#9db0cb;
    --panel-line:#2a3b56; --panel-shadow:rgba(0,0,0,.55);
    --accent:#ff4d6d; --accent-ink:#1b0710; --gold:#ffcc3d;
    --rail:rgba(21,33,54,.92);
    --glare:.12; --vig:.42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky-1:#0b1830; --sky-2:#162d52; --sky-3:#27496f;
  --grass:#2e6b46; --grass-2:#275b3b; --kerb:#3b4c66;
  --slab-top:#2c3b54; --slab-side:#1e2a3c; --slab-deep:#151d2b; --rock:#121a27;
  --tile-face:#e9eef6;
  --panel:rgba(17,27,45,.93); --panel-ink:#e9f1fb; --panel-sub:#9db0cb;
  --panel-line:#2a3b56; --panel-shadow:rgba(0,0,0,.55);
  --accent:#ff4d6d; --accent-ink:#1b0710; --gold:#ffcc3d;
  --rail:rgba(21,33,54,.92);
  --glare:.12; --vig:.42;
  color-scheme: dark;
}

html,body{height:100%}
body{
  margin:0; overflow:hidden;
  background:var(--sky-2); color:var(--panel-ink);
  font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{position:relative;height:100%;width:100%}
canvas#scene{display:block;width:100%;height:100%;touch-action:manipulation;cursor:default}

.glare,.vig{position:absolute;inset:0;pointer-events:none;z-index:1}
.glare{background:radial-gradient(42% 34% at 74% 6%, rgba(255,246,219,.9), transparent 70%);opacity:var(--glare)}
.vig{background:radial-gradient(124% 94% at 50% 40%, transparent 45%, rgba(8,22,46,.9) 100%);opacity:var(--vig)}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.hud > *{pointer-events:auto}

.player{
  position:absolute;display:flex;align-items:center;gap:10px;
  background:var(--panel);border-radius:16px;
  box-shadow:0 10px 28px var(--panel-shadow);
  padding:9px 13px;backdrop-filter:blur(10px);
  border:1px solid var(--panel-line); min-width:190px;
}
.player.tl{top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px))}
.player.tr{top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));flex-direction:row-reverse;text-align:right}
.player.bl{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px))}
.player.br{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));flex-direction:row-reverse;text-align:right}
.player .pip{width:36px;height:36px;border-radius:11px;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;font-family:'Baloo 2',sans-serif}
.player .meta{display:flex;flex-direction:column;line-height:1.18;min-width:0}
.player .nm{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em}
.player .cash{font-weight:700;font-size:13px;color:var(--panel-sub);font-variant-numeric:tabular-nums}
.player.active{outline:2px solid var(--gold);outline-offset:1px}
.player .turn{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}

.rail{
  position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:9px;
}
.rail button{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--panel-line);
  background:var(--rail);color:var(--panel-ink);font-size:18px;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 8px 20px var(--panel-shadow);
  backdrop-filter:blur(10px);transition:transform .12s ease,background .12s ease;
}
.rail button:hover{transform:scale(1.08)}
.rail button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.rail button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.actionbar{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;
}
.roll{
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:17px;letter-spacing:.03em;
  padding:14px 28px;border-radius:999px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:0 12px 26px rgba(224,47,82,.42), inset 0 -3px 0 rgba(0,0,0,.2);
  transition:transform .12s ease, filter .12s ease;
}
.roll:hover{transform:translateY(-2px)}
.roll:disabled{filter:grayscale(.55);cursor:default;transform:none}
.roll:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.dicebox{
  background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
  padding:10px 15px;font-weight:700;font-size:13px;color:var(--panel-ink);
  box-shadow:0 8px 20px var(--panel-shadow);backdrop-filter:blur(10px);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* bảng giá cột trái */
.legend{
  position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);
  width:250px;max-height:min(68vh,580px);overflow:auto;
  background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;
  box-shadow:0 14px 36px var(--panel-shadow);backdrop-filter:blur(12px);padding:15px;
}
.legend[hidden]{display:none!important}
.legend h2{margin:0 0 3px;font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:var(--panel-ink)}
.legend .note{margin:0 0 11px;font-size:11.5px;color:var(--panel-sub);line-height:1.45}
.grp{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-top:1px solid var(--panel-line)}
.grp:first-of-type{border-top:0}
.grp .sw{width:12px;height:12px;border-radius:4px;margin-top:4px;flex:0 0 auto}
.grp .gi{min-width:0;flex:1;display:flex;flex-direction:column}
.grp .gn{font-weight:700;font-size:12.5px;color:var(--panel-ink);line-height:1.3}
.grp .gc{font-size:11.5px;color:var(--panel-sub);line-height:1.4}
.grp .gp{font-size:11px;color:var(--panel-sub);font-variant-numeric:tabular-nums}
.legend h3{margin:13px 0 4px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--panel-sub)}

/* thẻ thông tin ô */
.tilecard{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
  width:min(304px,86vw);
  background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;
  box-shadow:0 24px 60px var(--panel-shadow);backdrop-filter:blur(14px);
  overflow:hidden;opacity:0;transition:opacity .18s ease, transform .18s ease;z-index:3;
}
.tilecard[hidden]{display:none!important}
.tilecard.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tilecard .band{height:46px;display:grid;place-items:center;color:#fff;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.tilecard .body{padding:15px 17px 17px}
.tilecard .ttl{font-family:'Baloo 2',sans-serif;font-size:23px;font-weight:800;margin:0 0 2px;color:var(--panel-ink)}
.tilecard .sub{font-size:12.5px;color:var(--panel-sub);margin:0 0 12px}
.tilecard table{width:100%;border-collapse:collapse;font-size:12.5px}
.tilecard td{padding:4px 0;color:var(--panel-ink)}
.tilecard td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tilecard tr+tr td{border-top:1px solid var(--panel-line)}
.tilecard .close{margin-top:13px;width:100%;padding:10px;border-radius:11px;border:1px solid var(--panel-line);
  background:transparent;color:var(--panel-sub);font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit}
.tilecard .close:hover{background:var(--panel-line)}

.badge-demo{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(14px + env(safe-area-inset-top,0px));
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--panel-sub);background:var(--panel);border:1px solid var(--panel-line);
  padding:5px 13px;border-radius:999px;box-shadow:0 6px 16px var(--panel-shadow);
}

/* ---------- HUD lượt chơi: mua đất, trả thuê, xây nhà ---------- */
.actpanel{
  position:absolute;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(82px + env(safe-area-inset-bottom,0px));
  width:min(430px, calc(100vw - 28px));
  background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;
  box-shadow:0 20px 48px var(--panel-shadow);backdrop-filter:blur(14px);
  overflow:hidden;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
.actpanel[hidden]{display:none!important}
.actpanel.show{opacity:1;transform:translateX(-50%) translateY(0)}
.actpanel .band{height:7px}
.actpanel .in{padding:14px 16px 15px}
.actpanel .hd{display:flex;align-items:flex-start;gap:12px}
.actpanel .gname{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--panel-sub);line-height:1.5}
.actpanel .tname{font-family:'Baloo 2',sans-serif;font-size:23px;font-weight:800;line-height:1.1;color:var(--panel-ink)}
.actpanel .price{margin-left:auto;text-align:right;flex:0 0 auto}
.actpanel .price b{display:block;font-family:'Baloo 2',sans-serif;font-size:25px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.actpanel .price span{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--panel-sub)}
.actpanel .rent{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0}
.actpanel .rent div{background:var(--panel-line);border-radius:10px;padding:7px 4px;text-align:center}
.actpanel .rent em{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--panel-sub);margin-bottom:2px}
.actpanel .rent b{font-size:13px;font-weight:800;color:var(--panel-ink);font-variant-numeric:tabular-nums}
.actpanel .msg{margin:11px 0 0;font-size:12.5px;line-height:1.5;color:var(--panel-sub)}
.actpanel .msg strong{color:var(--panel-ink)}
.actpanel .msg.warn{color:var(--accent);font-weight:600}
.actpanel .btns{display:flex;gap:8px;margin-top:13px}
.actpanel .btn{
  flex:1;padding:12px 10px;border-radius:13px;border:0;cursor:pointer;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;
  transition:transform .12s ease, filter .12s ease;
}
.actpanel .btn:hover{transform:translateY(-1px)}
.actpanel .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.actpanel .btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px rgba(224,47,82,.35), inset 0 -3px 0 rgba(0,0,0,.2)}
.actpanel .btn.pri:disabled{filter:grayscale(.6) opacity(.6);cursor:default;transform:none;box-shadow:none}
.actpanel .btn.gh{flex:0 0 auto;min-width:112px;background:transparent;border:1px solid var(--panel-line);color:var(--panel-sub);font-size:14px}
.actpanel .btn.gh:hover{background:var(--panel-line)}
.actpanel .timer{height:3px;background:var(--panel-line)}
.actpanel .timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left center}

#deltas{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.delta{
  position:absolute;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;
  text-shadow:0 2px 6px rgba(0,0,0,.28);white-space:nowrap;
  animation:bayLen 1.25s cubic-bezier(.2,.7,.3,1) forwards;
}
.delta.tru{color:#ff5b76}
.delta.cong{color:#39c47a}
@keyframes bayLen{
  0%{opacity:0;transform:translate(-50%,6px) scale(.9)}
  18%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  100%{opacity:0;transform:translate(-50%,-34px) scale(1)}
}
@media (prefers-reduced-motion: reduce){
  .delta{animation-duration:.5s}
  .actpanel{transition:none}
}

@media (max-width:1180px){
  .legend{width:214px;max-height:52vh;padding:13px}
}
@media (max-width:640px){
  .player{min-width:0;padding:6px 9px;gap:7px}
  .player .pip{width:27px;height:27px;border-radius:9px;font-size:12px}
  .player .nm{font-size:12.5px}
  .player .cash{font-size:11px}
  .player .turn{font-size:9px}
  .rail{top:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:none;flex-direction:row}
  .rail button{width:40px;height:40px;font-size:16px}
  .roll{font-size:15px;padding:12px 22px}
  .dicebox{font-size:11.5px;padding:8px 11px}
  .legend{left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));width:min(300px,92vw);max-height:40vh}
  .badge-demo{font-size:9.5px;padding:4px 10px}
  .actpanel{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  .actpanel .in{padding:12px 13px 13px}
  .actpanel .tname{font-size:20px}
  .actpanel .price b{font-size:21px}
  .actpanel .rent{gap:5px}
  .actpanel .rent b{font-size:12px}
  .actpanel .btn{font-size:14px;padding:11px 8px}
  .actpanel .btn.gh{min-width:92px;font-size:13px}
}
</style>

<div id="stage">
  <canvas id="scene" aria-label="Bàn cờ tỷ phú Việt Nam ba chiều"></canvas>
  <div class="glare"></div>
  <div class="vig"></div>

  <div class="hud">
    <div class="player tl" data-p="1">
      <div class="pip" style="background:#e7405e">H</div>
      <div class="meta"><span class="nm">HÙNG</span><span class="cash">1.852.500</span></div>
    </div>
    <div class="player tr" data-p="2">
      <div class="pip" style="background:#f2b705">L</div>
      <div class="meta"><span class="nm">LAN</span><span class="cash">815.000</span></div>
    </div>
    <div class="player bl active" data-p="0">
      <div class="pip" style="background:#3fb36b">B</div>
      <div class="meta"><span class="nm">BẠN</span><span class="cash">2.000.000</span><span class="turn">Lượt của bạn</span></div>
    </div>
    <div class="player br" data-p="3">
      <div class="pip" style="background:#3b82f6">M</div>
      <div class="meta"><span class="nm">MINH</span><span class="cash">530.000</span></div>
    </div>

    <div class="badge-demo">Mẫu giao diện — luật rút gọn</div>

    <div class="rail">
      <button id="btnTheme" type="button" title="Đổi ngày / đêm">☾</button>
      <button id="btnLegend" type="button" aria-pressed="true" title="Bảng giá đất">☰</button>
      <button id="btnFx" type="button" aria-pressed="true" title="Hiệu ứng ánh sáng">✦</button>
    </div>

    <div class="actionbar">
      <button class="roll" id="btnRoll" type="button">TUNG XÚC XẮC</button>
      <div class="dicebox" id="diceOut">Bấm vào một ô để xem giá</div>
    </div>

    <aside class="legend" id="legend">
      <h2>Bảng giá đất</h2>
      <p class="note">8 nhóm tỉnh thành trải từ Bắc vào Nam, mỗi nhóm 2 ô. 4 ô biển thay cho nhà ga.</p>
      <div id="legendGroups"></div>
      <h3>Bốn ô biển</h3>
      <div id="legendPorts"></div>
    </aside>

    <div class="actpanel" id="actpanel" hidden>
      <div class="band" id="apBand"></div>
      <div class="in">
        <div class="hd">
          <div>
            <div class="gname" id="apGroup"></div>
            <div class="tname" id="apName"></div>
          </div>
          <div class="price" id="apPrice"></div>
        </div>
        <div class="rent" id="apRent"></div>
        <div class="msg" id="apMsg"></div>
        <div class="btns" id="apBtns"></div>
      </div>
      <div class="timer" id="apTimer" hidden><i></i></div>
    </div>

    <div class="tilecard" id="tilecard" hidden>
      <div class="band" id="tcBand"></div>
      <div class="body">
        <h3 class="ttl" id="tcTitle"></h3>
        <p class="sub" id="tcSub"></p>
        <table id="tcTable"></table>
        <button class="close" id="tcClose" type="button">Đóng</button>
      </div>
    </div>
  </div>

  <div id="deltas"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

function viTri(i){
  var x,z,ry,ox,oz;
  if (i===0)       { x= TRUC; z= TRUC; ry=0;          ox= .7; oz= .7; }
  else if (i<9)    { x=(NUA-GOC-RONG/2)-(i-1)*RONG; z= TRUC; ry=0;          ox=0; oz=1; }
  else if (i===9)  { x=-TRUC; z= TRUC; ry=-Math.PI/2; ox=-.7; oz= .7; }
  else if (i<18)   { x=-TRUC; z=(NUA-GOC-RONG/2)-(i-10)*RONG; ry=-Math.PI/2; ox=-1; oz=0; }
  else if (i===18) { x=-TRUC; z=-TRUC; ry=Math.PI;    ox=-.7; oz=-.7; }
  else if (i<27)   { x=-(NUA-GOC-RONG/2)+(i-19)*RONG; z=-TRUC; ry=Math.PI;  ox=0; oz=-1; }
  else if (i===27) { x= TRUC; z=-TRUC; ry=Math.PI/2;  ox= .7; oz=-.7; }
  else             { x= TRUC; z=-(NUA-GOC-RONG/2)+(i-28)*RONG; ry=Math.PI/2; ox=1; oz=0; }
  return { x:x, z:z, ry:ry, ox:ox, oz:oz, goc:(i%9===0) };
}

function hinhBo(w,d,r){
  r = Math.min(r, w/2-0.002, d/2-0.002);
  var s = new THREE.Shape(), x=-w/2, y=-d/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+d-r); s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d);   s.quadraticCurveTo(x,y+d,x,y+d-r);
  s.lineTo(x,y+r);     s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function hopBo(w,h,d,r,bev){
  bev = Math.min(bev===undefined?0.05:bev, h*0.24, r*0.7);
  var g = new THREE.ExtrudeGeometry(hinhBo(w,d,r), {
    depth: h-bev*2, bevelEnabled:true, bevelThickness:bev, bevelSize:bev,
    bevelSegments:2, curveSegments:6
  });
  g.rotateX(-Math.PI/2); g.translate(0,bev,0); g.computeVertexNormals();
  return g;
}
function M(color, rough, metal){
  return new THREE.MeshStandardMaterial({
    color:color, roughness:rough===undefined?0.82:rough, metalness:metal||0, envMapIntensity:0.32 });
}

function damMau(c){
  var hsl = {}; c.getHSL(hsl);
  if (hsl.s < 0.07) c.setHSL(0.095, 0.16, Math.min(0.88, hsl.l*0.93));
  else c.setHSL(hsl.h, Math.min(1, hsl.s*1.55), Math.max(0.12, Math.min(0.78, hsl.l*0.88)));
}

function khoi(geo, mat, x, y, z){
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x||0, y||0, z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function nhaMai(w,h,d,tuong,mai){
  var g = new THREE.Group();
  g.add(khoi(hopBo(w,h,d,0.09,0.035), M(tuong,.78), 0, 0, 0));
  var m = khoi(new THREE.ConeGeometry(Math.max(w,d)*0.76, h*0.72, 4), M(mai,.74), 0, h+h*0.36, 0);
  m.rotation.y = Math.PI/4;
  g.add(m);
  return g;
}

function thapTang(n, r0, hT, tuong, mai){
  var g = new THREE.Group(), y = 0;
  for (var i=0;i<n;i++){
    var r = r0 * (1 - i*0.14);
    g.add(khoi(new THREE.CylinderGeometry(r*0.82, r, hT, 8), M(tuong,.8), 0, y+hT/2, 0));
    var m = khoi(new THREE.ConeGeometry(r*1.5, hT*0.5, 8), M(mai,.7), 0, y+hT+hT*0.22, 0);
    g.add(m);
    y += hT*0.96;
  }
  g.add(khoi(new THREE.ConeGeometry(r0*0.3, hT*0.9, 8), M(mai,.6), 0, y+hT*0.42, 0));
  return g;
}

function trangTriGoc(icon){
  var g = new THREE.Group();
  if (icon === 'start'){
    var c = congVom(2.2,1.3,0xe02f52); g.add(c);
    g.add(khoi(hopBo(1.5,0.16,0.3,0.06,0.04), M(0xf5b821,.6,.25), 0,1.4,0));
    [-1.3,1.3].forEach(function(x){
      g.add(khoi(new THREE.CylinderGeometry(0.03,0.03,1.4,5), M(0xdfe6ee,.7), x,0.7,0.3));
      g.add(khoi(new THREE.PlaneGeometry(0.4,0.26), new THREE.MeshStandardMaterial({color:0xf5b821,side:THREE.DoubleSide,roughness:.8}), x+(x>0?0.2:-0.2),1.3,0.3));
    });
  } else if (icon === 'jail'){
    g.add(khoi(hopBo(2.2,0.1,1.6,0.3,0.04), M(0xf0e2bd,.95), 0,0,0));
    var n1 = nuiDa(1.5,0.55); n1.position.set(-0.8,0.05,-0.3); g.add(n1);
    var d1 = dua(1.5); d1.position.set(0.5,0.05,0.1); g.add(d1);
    var d2 = dua(1.1); d2.position.set(1.05,0.05,-0.4); g.add(d2);
  } else if (icon === 'fest'){
    g.add(khoi(new THREE.CylinderGeometry(1.25,1.35,0.22,16), M(0xdc4b63,.84), 0,0.11,0));
    g.add(khoi(new THREE.CylinderGeometry(0.95,0.95,0.14,16), M(0xf4e3bd,.9), 0,0.28,0));
    for (var i=0;i<8;i++){
      var a = i*Math.PI/4;
      g.add(khoi(new THREE.CylinderGeometry(0.035,0.035,1.3,5), M(0xe8eef7,.75), Math.cos(a)*1.0, 0.65, Math.sin(a)*1.0));
      var la = khoi(new THREE.PlaneGeometry(0.36,0.24),
        new THREE.MeshStandardMaterial({color:i%2?0xf5b821:0x2f5bd4,side:THREE.DoubleSide,roughness:.82}),
        Math.cos(a)*1.0+0.18, 1.2, Math.sin(a)*1.0);
      g.add(la);
    }
    g.add(khoi(new THREE.OctahedronGeometry(0.34), M(0xf5b821,.35,.45), 0, 0.72, 0));
  } else {
    /* máy bay nhỏ cho ô Du lịch xuyên Việt */
    var mau = M(0xeef3f9,.5,.25);
    var than = khoi(new THREE.CylinderGeometry(0.2,0.2,1.8,12), mau, 0,1.0,0);
    than.rotation.z = Math.PI/2; g.add(than);
    var mui = khoi(new THREE.ConeGeometry(0.2,0.45,12), mau, 1.12,1.0,0);
    mui.rotation.z = -Math.PI/2; g.add(mui);
    g.add(khoi(hopBo(0.52,0.07,2.0,0.05,0.025), M(0xd93b4e,.65), 0,1.02,0));
    g.add(khoi(hopBo(0.3,0.46,0.09,0.04,0.02), M(0xd93b4e,.65), -0.75,1.26,0));
    g.add(khoi(hopBo(0.26,0.06,0.7,0.04,0.02), M(0xd93b4e,.65), -0.78,1.02,0));
    g.add(khoi(new THREE.CylinderGeometry(0.035,0.035,1.0,6), M(0xcdd7e3,.7), 0,0.5,0));
  }
  return g;
}

function texMoiTruong(){
  var W=512, H=256, c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d'), toi = laToi();
  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,    css('--sky-1'));
  g.addColorStop(0.40, css('--sky-2'));
  g.addColorStop(0.50, css('--sky-3'));
  g.addColorStop(0.52, toi ? '#1b2a22' : '#9bae95');   // đường chân trời
  g.addColorStop(1,    toi ? '#0d1511' : '#6d7d6c');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  var sx=W*0.72, sy=H*0.2;
  var sg=x.createRadialGradient(sx,sy,0,sx,sy,H*0.42);
  sg.addColorStop(0,   'rgba(255,252,238,'+(toi?0.45:1)+')');
  sg.addColorStop(0.2, 'rgba(255,245,216,'+(toi?0.14:0.5)+')');
  sg.addColorStop(1,   'rgba(255,245,216,0)');
  x.fillStyle=sg; x.fillRect(0,0,W,H*0.52);
  x.globalAlpha = toi ? 0.1 : 0.3;
  x.fillStyle = '#ffffff';
  for (var i=0;i<9;i++){
    var cx=Math.random()*W, cy=H*(0.12+Math.random()*0.3), r=10+Math.random()*26;
    x.beginPath(); x.ellipse(cx,cy,r,r*0.4,0,0,Math.PI*2); x.fill();
  }
  x.globalAlpha = 1;
  return c;
}

var legendEl = document.getElementById('legend');
function dongKhung(){
  var W = canvas.clientWidth, H = canvas.clientHeight;
  renderer.setSize(W, H, false);
  if (composer){
    composer.setSize(W, H);
    if (fxaaPass){
      var pr = renderer.getPixelRatio();
      fxaaPass.material.uniforms['resolution'].value.set(1/(W*pr), 1/(H*pr));
    }
  }

  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  var v = new THREE.Vector3();
  BBOX.forEach(function(p){
    v.copy(p).applyMatrix4(camera.matrixWorldInverse);
    if (v.x<minX) minX=v.x; if (v.x>maxX) maxX=v.x;
    if (v.y<minY) minY=v.y; if (v.y>maxY) maxY=v.y;
  });
  var halfW = Math.max(Math.abs(minX), Math.abs(maxX));
  var halfH = Math.max(Math.abs(minY), Math.abs(maxY));

  /* chừa chỗ cho HUD: cột trái khi rộng, thanh trên/dưới luôn có */
  var padX = 14, padY = 72;
  var chuaTrai = (W >= 1180 && !legendEl.hidden) ? 282 : 0;
  var usableW = Math.max(220, W - padX*2 - chuaTrai);
  var usableH = Math.max(220, H - padY*2);

  var scale = Math.min(usableW / (halfW*2), usableH / (halfH*2));  // px trên 1 đơn vị
  var viewH = H / scale / 2;
  var viewW = W / scale / 2;

  /* đẩy bàn cờ sang phải khi có cột bảng giá */
  var lech = (chuaTrai/2) / scale;

  camera.left   = -viewW - lech;
  camera.right  =  viewW - lech;
  camera.top    =  viewH;
  camera.bottom = -viewH;
  camera.updateProjectionMatrix();
}

/* ---- chuỗi hậu kỳ: khử răng cưa đa mẫu + quầng sáng ---- */
var composer = null, bloomPass = null, fxaaPass = null, batHieuUng = true;
function dungComposer(){
  var W = canvas.clientWidth || 960, H = canvas.clientHeight || 600;
  renderer.setSize(W, H, false);
  var s = new THREE.Vector2(); renderer.getDrawingBufferSize(s);
  var opt = { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
              format:THREE.RGBAFormat, encoding:THREE.sRGBEncoding };
  var webgl2 = renderer.capabilities.isWebGL2;
  var rt = webgl2 ? new THREE.WebGLMultisampleRenderTarget(s.x, s.y, opt)
                  : new THREE.WebGLRenderTarget(s.x, s.y, opt);
  if (webgl2) rt.samples = CAO ? 4 : 2;

  composer = new THREE.EffectComposer(renderer, rt);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloomPass = new THREE.UnrealBloomPass(s, 0.34, 0.62, 0.88);
  composer.addPass(bloomPass);
  if (!webgl2){
    fxaaPass = new THREE.ShaderPass(THREE.FXAAShader);
    composer.addPass(fxaaPass);
  }
  dongKhung();
}

      diChuyen(0, tong, function(){
        diceOut.textContent = tong+' → '+BOARD[PLAYER_POS[0]].ten;
        xuLyO(PLAYER_POS[0]);
      });
    }
  }
  requestAnimationFrame(quay);
});

function diChuyen(pi, buoc, xong){
  var conLai = buoc;
  function motBuoc(){
    if (conLai === 0){ datQuan(); xong(); return; }
    var tu = PLAYER_POS[pi], den = (tu+1) % BOARD.length;
    PLAYER_POS[pi] = den;
    if (den === 0) doiTien(pi, 200*DON_VI);        // đi qua ô Xuất phát
    var p0 = viTriO[tu], p1 = viTriO[den];
    var t0 = performance.now(), dur = reduce?60:185;
    function nhay(now){
      var t = Math.min(1,(now-t0)/dur);
      quan[pi].position.x = p0.x + (p1.x-p0.x)*t;
      quan[pi].position.z = p0.z + (p1.z-p0.z)*t;
      quan[pi].position.y = DAY + Math.sin(t*Math.PI)*0.8;
      if (t<1) requestAnimationFrame(nhay); else { conLai--; motBuoc(); }
    }
    requestAnimationFrame(nhay);
  }
  motBuoc();
}

/* ============================================================
   8b. HUD LƯỢT CHƠI — mua đất, trả tiền thuê, xây nhà
   ============================================================ */
var TOI = 0;                                   // người chơi 0 = BẠN
var ap       = document.getElementById('actpanel');
var apBand   = document.getElementById('apBand');
var apGroup  = document.getElementById('apGroup');
var apName   = document.getElementById('apName');
var apPrice  = document.getElementById('apPrice');
var apRent   = document.getElementById('apRent');
var apMsg    = document.getElementById('apMsg');
var apBtns   = document.getElementById('apBtns');
var apTimer  = document.getElementById('apTimer');
var hetGio   = null;

function capNhatTien(){
  Array.prototype.forEach.call(document.querySelectorAll('.player'), function(el){
    el.querySelector('.cash').textContent = tienVN(PLAYERS[+el.getAttribute('data-p')].tien);
  });
}
function bayTien(pi, so){
  var el = document.querySelector('.player[data-p="'+pi+'"]');
  if (!el) return;
  var r = el.getBoundingClientRect(), s = document.getElementById('stage').getBoundingClientRect();
  var d = document.createElement('div');
  d.className = 'delta ' + (so<0 ? 'tru' : 'cong');
  d.textContent = (so<0 ? '−' : '+') + tienVN(Math.abs(so));
  d.style.left = (r.left - s.left + r.width/2) + 'px';
  d.style.top  = (r.top  - s.top  + r.height + 2) + 'px';
  document.getElementById('deltas').appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 1400);
}
function doiTien(pi, delta){
  PLAYERS[pi].tien += delta;
  capNhatTien();
  bayTien(pi, delta);
}
capNhatTien();

function tienThue(i){
  var o = BOARD[i];
  if (o.chu === undefined) return 0;
  if (o.t === 'dat'){
    var b = thue(Math.round(o.gia/10));
    if (o.nha >= 5) return b[5]*DON_VI;
    if (o.nha > 0)  return b[o.nha]*DON_VI;
    return (tronBo(o.nhom, o.chu) ? b[0]*2 : b[0]) * DON_VI;
  }
  if (o.t === 'bien'){
    var n = BOARD.filter(function(x){ return x.t==='bien' && x.chu===o.chu; }).length;
    return [25,50,100,200][Math.max(0,n-1)] * DON_VI;
  }
  if (o.t === 'tienich'){
    var m = BOARD.filter(function(x){ return x.t==='tienich' && x.chu===o.chu; }).length;
    return lanTungCuoi * (m>=2 ? 10 : 4) * DON_VI;
  }
  return 0;
}

function moPanel(){ ap.hidden=false; requestAnimationFrame(function(){ ap.classList.add('show'); }); }
function dongPanel(){
  ap.classList.remove('show');
  if (hetGio){ clearTimeout(hetGio); hetGio = null; }
  apTimer.hidden = true;
  setTimeout(function(){ if (!ap.classList.contains('show')) ap.hidden = true; }, 220);
}
function xongLuot(){ dongPanel(); dangTung = false; btnRoll.disabled = false; }

function themNut(nhan, loai, tat, fn){
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'btn ' + loai; b.textContent = nhan; b.disabled = !!tat;
  b.addEventListener('click', fn);
  apBtns.appendChild(b);
}
function dongHo(giay){
  apTimer.hidden = false;
  var bar = apTimer.firstElementChild;
  bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
  requestAnimationFrame(function(){
    bar.style.transition = 'transform '+giay+'s linear';
    bar.style.transform = 'scaleX(0)';
  });
  hetGio = setTimeout(function(){
    diceOut.textContent = 'Hết giờ — ô được đưa ra đấu giá';
    xongLuot();
  }, giay*1000);
}
function veThanhThue(o){
  if (o.t !== 'dat'){ apRent.hidden = true; apRent.innerHTML = ''; return; }
  var b = thue(Math.round(o.gia/10));
  apRent.hidden = false;
  apRent.innerHTML = [['Đất trống',b[0]],['Trọn bộ',b[0]*2],['3 nhà',b[3]],['Khách sạn',b[5]]]
    .map(function(r){ return '<div><em>'+r[0]+'</em><b>'+r[1]+'K</b></div>'; }).join('');
}

function xuLyO(i){
  var o = BOARD[i];
  apBand.style.background = mauO(o);
  apGroup.textContent = (o.t==='dat') ? GROUPS[o.nhom].ten.toUpperCase() : nhanLoai(o);
  apName.textContent  = o.ten;
  apMsg.className = 'msg';
  apBtns.innerHTML = ''; apPrice.innerHTML = ''; apTimer.hidden = true;
  veThanhThue(o);

  var muaDuoc = (o.t==='dat' || o.t==='bien' || o.t==='tienich');

  /* ---------- 1. Ô chưa có chủ: MUA ĐẤT ---------- */
  if (muaDuoc && o.chu === undefined){
    var gia = giaMua(o), du = PLAYERS[TOI].tien >= gia;
    apPrice.innerHTML = '<b>'+o.gia+'K</b><span>Giá mua</span>';
    apMsg.innerHTML = du
      ? 'Bạn đang có <strong>'+tienVN(PLAYERS[TOI].tien)+'</strong>, mua xong còn <strong>'+tienVN(PLAYERS[TOI].tien-gia)+'</strong>.'
      : 'Bạn chỉ có <strong>'+tienVN(PLAYERS[TOI].tien)+'</strong>, còn thiếu '+tienVN(gia-PLAYERS[TOI].tien)+'.';
    if (!du) apMsg.classList.add('warn');
    themNut('MUA '+o.gia+'K', 'pri', !du, function(){
      doiTien(TOI, -gia);
      o.chu = TOI; o.nha = 0;
      veSoHuu(i);
      diceOut.textContent = 'Đã mua '+o.ten;
      xongLuot();
    });
    themNut('Bỏ qua', 'gh', false, function(){
      diceOut.textContent = o.ten+' được đưa ra đấu giá';
      xongLuot();
    });
    dongHo(25);
    moPanel(); return;
  }

  /* ---------- 2. Ô của người khác: TRẢ TIỀN THUÊ ---------- */
  if (muaDuoc && o.chu !== TOI){
    var t = tienThue(i), chu = PLAYERS[o.chu];
    apPrice.innerHTML = '<b>'+tienVN(t)+'</b><span>Tiền thuê</span>';
    var them = '';
    if (o.t==='dat' && o.nha) them = o.nha>=5 ? ' — đã có khách sạn' : ' — đã có '+o.nha+' nhà';
    if (o.t==='dat' && !o.nha && tronBo(o.nhom, o.chu)) them = ' — trọn nhóm nên thuê nhân đôi';
    if (o.t==='tienich') them = ' — tính theo điểm xúc xắc ('+lanTungCuoi+')';
    apMsg.innerHTML = 'Ô này của <strong>'+chu.ten+'</strong>'+them+'.';
    if (PLAYERS[TOI].tien < t){
      apMsg.innerHTML += ' Bạn không đủ tiền mặt — theo luật phải bán nhà hoặc thế chấp đất trước.';
      apMsg.classList.add('warn');
    }
    themNut('TRẢ '+tienVN(t), 'pri', false, function(){
      doiTien(TOI, -t); doiTien(o.chu, t);
      diceOut.textContent = 'Đã trả '+tienVN(t)+' cho '+chu.ten;
      xongLuot();
    });
    moPanel(); return;
  }

  /* ---------- 3. Ô của bạn: XÂY NHÀ ---------- */
  if (muaDuoc && o.chu === TOI){
    var soNha = o.nha || 0;
    apPrice.innerHTML = '<b>'+(soNha>=5 ? 'KS' : soNha)+'</b><span>'+(soNha>=5 ? 'Khách sạn' : 'Nhà đã xây')+'</span>';
    if (o.t !== 'dat'){
      apMsg.textContent = 'Ô của bạn, nghỉ chân không mất gì.';
      themNut('Tiếp tục', 'pri', false, xongLuot);
      moPanel(); return;
    }
    var gx = giaXay(o);
    var itNhat = Math.min.apply(null, BOARD.filter(function(x){ return x.nhom===o.nhom; })
                                          .map(function(x){ return x.nha || 0; }));
    var duTron = tronBo(o.nhom, TOI), xayDeu = soNha <= itNhat, duTien = PLAYERS[TOI].tien >= gx;

    if (duTron && xayDeu && soNha < 5 && duTien){
      apMsg.innerHTML = 'Bạn đã trọn nhóm <strong>'+GROUPS[o.nhom].ten+'</strong>. '+
        (soNha===4 ? 'Nâng 4 nhà lên khách sạn.' : 'Xây thêm nhà để tăng tiền thuê.');
      themNut((soNha===4 ? 'XÂY KHÁCH SẠN ' : 'XÂY NHÀ ')+Math.round(gx/DON_VI)+'K', 'pri', false, function(){
        doiTien(TOI, -gx); o.nha = soNha + 1; veSoHuu(i);
        diceOut.textContent = o.nha>=5 ? 'Đã xây khách sạn ở '+o.ten : 'Đã xây nhà thứ '+o.nha+' ở '+o.ten;
        xongLuot();
      });
      themNut('Để sau', 'gh', false, xongLuot);
    } else {
      apMsg.innerHTML =
        !duTron  ? 'Đất của bạn. Phải sở hữu cả nhóm <strong>'+GROUPS[o.nhom].ten+'</strong> mới được xây nhà.' :
        soNha>=5 ? 'Đã có khách sạn, không xây thêm được nữa.' :
        !xayDeu  ? 'Luật xây đều: hãy xây ở ô còn ít nhà hơn trong nhóm trước.' :
                   'Không đủ tiền xây, cần '+Math.round(gx/DON_VI)+'K.';
      if (!duTien && duTron && xayDeu && soNha<5) apMsg.classList.add('warn');
      themNut('Tiếp tục', 'pri', false, xongLuot);
    }
    moPanel(); return;
  }

  /* ---------- 4. Các ô còn lại ---------- */
  if (o.t === 'thue'){
    apPrice.innerHTML = '<b>'+o.so+'K</b><span>Phải nộp</span>';
    apMsg.textContent = o.phu || '';
    themNut('NỘP '+o.so+'K', 'pri', false, function(){
      doiTien(TOI, -o.so*DON_VI);
      diceOut.textContent = 'Đã nộp '+o.so+'K';
      xongLuot();
    });
  } else if (o.t === 'goc' && o.icon === 'start'){
    apMsg.innerHTML = 'Về đúng ô Xuất phát. Bạn đã nhận <strong>200K</strong> tiền lương.';
    themNut('Tiếp tục', 'pri', false, xongLuot);
  } else {
    apMsg.textContent = {
      cohoi:'Rút một thẻ Cơ hội trên cùng và làm theo nội dung.',
      khivan:'Rút một thẻ Khí vận trên cùng và làm theo nội dung.'
    }[o.t] || o.phu || 'Nghỉ chân, không mất gì.';
    themNut('Tiếp tục', 'pri', false, xongLuot);
  }
  moPanel();
}

window.addEventListener('keydown', function(e){
  if (ap.hidden || !theO.hidden) return;       // thẻ thông tin ô ưu tiên phím Esc
  if (e.key === 'Enter'){
    var p = apBtns.querySelector('.btn.pri:not(:disabled)');
    if (p){ e.preventDefault(); p.click(); }
  } else if (e.key === 'Escape'){
    var g = apBtns.querySelector('.btn.gh');
    if (g){ e.preventDefault(); g.click(); }
  }
});

/* ============================================================
   9. NÚT & BẢNG GIÁ
   ============================================================ */
var btnTheme = document.getElementById('btnTheme');
btnTheme.addEventListener('click', function(){
  var toi = laToi();
  document.documentElement.setAttribute('data-theme', toi ? 'light' : 'dark');
  btnTheme.textContent = toi ? '☾' : '☀';
});
var btnLegend = document.getElementById('btnLegend');
btnLegend.addEventListener('click', function(){
  legendEl.hidden = !legendEl.hidden;
  btnLegend.setAttribute('aria-pressed', String(!legendEl.hidden));
  dongKhung();
});
if (window.innerWidth < 900){ legendEl.hidden = true; btnLegend.setAttribute('aria-pressed','false'); }

var btnFx = document.getElementById('btnFx');
btnFx.addEventListener('click', function(){
  batHieuUng = !batHieuUng;
  btnFx.setAttribute('aria-pressed', String(batHieuUng));
  btnFx.title = batHieuUng ? 'Tắt hiệu ứng ánh sáng' : 'Bật hiệu ứng ánh sáng';
});

(function bangGia(){
  var thuTu = ['hagiang','laocai','ninhbinh','hue','quangnam','lamdong','hcm','hanoi'];
  document.getElementById('legendGroups').innerHTML = thuTu.map(function(key){
    var g = GROUPS[key], os = BOARD.filter(function(o){ return o.nhom===key; });
    return '<div class="grp"><span class="sw" style="background:'+g.mau+'"></span>'+
      '<span class="gi"><span class="gn">'+g.ten+'</span>'+
      '<span class="gc">'+os.map(function(o){return o.ten;}).join(' · ')+'</span>'+
      '<span class="gp">'+os.map(function(o){return o.gia+'K';}).join(' / ')+'</span></span></div>';
  }).join('');
  document.getElementById('legendPorts').innerHTML =
    BOARD.filter(function(o){ return o.t==='bien'; }).map(function(o){
      return '<div class="grp"><span class="sw" style="background:'+PORT_COLOR+'"></span>'+
        '<span class="gi"><span class="gn">'+o.ten+'</span>'+
        '<span class="gc">'+o.phu+'</span><span class="gp">'+o.gia+'K</span></span></div>';
    }).join('');
})();

/* ============================================================
   10. NGÀY / ĐÊM
   ============================================================ */
function dongBoMau(){
  bgTex.image = nenTroi(); bgTex.needsUpdate = true;
  coTex.image = texCo();   coTex.needsUpdate = true;
  matTop.color.set(css('--slab-top'));
  matSide.color.set(css('--slab-side'));
  matDeep.color.set(css('--slab-deep'));
  matRock.color.set(css('--rock'));
  matKerb.color.set(css('--kerb'));
  matCoNen.color.set(css('--grass'));
  var toi = laToi();
  hemi.intensity = toi ? 0.09 : 0.12;
  sun.intensity  = toi ? 0.45 : 1.45;
  sun.color.set(toi ? 0xa9c6ff : 0xfff2d8);
  fill.intensity = toi ? 0.18 : 0.26;
  rim.intensity  = toi ? 0.24 : 0.3;
  renderer.toneMappingExposure = toi ? 0.68 : 0.5;
  if (scene.fog) scene.fog.color.set(css('--sky-2'));
  /* bàn cờ gần như trắng nên ban ngày phải để ngưỡng quầng sáng rất cao */
  if (bloomPass){
    bloomPass.strength  = toi ? 0.70 : 0.11;
    bloomPass.threshold = toi ? 0.78 : 0.97;
    bloomPass.radius    = toi ? 0.72 : 0.5;
  }
  vatLieuCuaSo.forEach(function(m){ m.emissive.set(toi ? 0xffcb6b : 0x000000); });
  mayList.forEach(function(s){ s.material.color.set(toi ? 0x5e7ba8 : 0xffffff); });
  btnTheme.textContent = toi ? '☀' : '☾';
  capNhatMoiTruong();
}
dungComposer();
dongBoMau();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', dongBoMau);
new MutationObserver(dongBoMau).observe(document.documentElement,
  { attributes:true, attributeFilter:['data-theme'] });

/* ============================================================
   11. VÒNG LẶP
   ============================================================ */
var lastW = 0, lastH = 0, dong = 0;
function ve(){
  requestAnimationFrame(ve);
  var W = canvas.clientWidth, H = canvas.clientHeight;
  if (W !== lastW || H !== lastH){ lastW = W; lastH = H; dongKhung(); }

  dong += 0.016;
  world.position.y = Math.sin(dong*0.55)*0.1;
  cocTien.forEach(function(g, i){
    g.position.y = g.userData.y0 + Math.sin(dong*0.7 + g.userData.ph)*0.22;
    g.rotation.y += 0.0015;
  });
  mayList.forEach(function(s){
    var u = s.userData; u.a += u.sp;
    s.position.x = Math.cos(u.a)*u.r;
    s.position.z = Math.sin(u.a)*u.r;
    s.position.y = u.y + Math.sin(dong*0.35 + u.ph)*0.35;
  });
  if (composer && batHieuUng) composer.render();
  else renderer.render(scene, camera);
}
ve();

try {
  if (window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return { pos:PLAYER_POS.slice() }; });
    var d = window.claude.hot.data;
    if (d && d.pos){ PLAYER_POS = d.pos; datQuan(); }
  }
} catch(e){}

})();
</script>
