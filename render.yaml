# Bản thiết kế hạ tầng cho Render: một web service chạy server Colyseus và
# một PostgreSQL đi kèm.
#
# Cách dùng: trên dashboard Render chọn New → Blueprint, trỏ vào repo này.
# Render đọc file này và dựng cả hai. Xem DEPLOY.md để biết phải điền gì.

services:
  - type: web
    name: co-ty-phu-be
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore          # gần Việt Nam nhất trong các vùng của Render
    plan: free                 # đổi sang starter khi muốn server không ngủ
    healthCheckPath: /health

    # Cố ý KHÔNG khai numInstances. Render mặc định một bản, mà gói free lại
    # không cho chạy nhiều hơn một bản nên khai vào chỉ tổ rủi ro.
    #
    # Có nâng gói thì vẫn giữ nguyên một bản: Colyseus giữ danh sách phòng
    # trong bộ nhớ tiến trình, chạy hai bản là mỗi bản thấy một danh sách
    # khác nhau và người chơi vào nhầm bản thì không gặp được nhau. Muốn
    # chạy nhiều bản phải thêm Redis presence và Redis driver trước đã.

    envVars:
      - key: NODE_ENV
        value: production

      # Render không tự đặt PORT; không khai thì nó đi dò cổng, dò không ra
      # là coi như 10000. Khai thẳng cho khỏi phải đoán — Dockerfile cũng
      # đang mở đúng cổng này.
      - key: PORT
        value: 2567

      # Render tự sinh khi dựng lần đầu rồi giữ nguyên mãi. Không bao giờ
      # phải nhìn thấy hay chép tay hai chuỗi này.
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: co-ty-phu-db
          property: connectionString

      # Lấy từ Google Cloud Console, điền trên dashboard sau khi dựng.
      # Chưa điền thì server vẫn chạy, chỉ là nút đăng nhập Google tắt.
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false

databases:
  - name: co-ty-phu-db
    databaseName: cotyphu
    user: cotyphu
    region: singapore
    plan: free                 # gói free của Render hết hạn sau 30 ngày
